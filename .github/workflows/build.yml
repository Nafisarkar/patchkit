name: Build and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Needed so the release step can create/update a GitHub Release.
permissions:
  contents: write

env:
  NSIS_EXE: 'C:\Program Files (x86)\NSIS\makensis.exe'

jobs:
  build:
    # PatchKit is Windows-only (Win32 APIs), so always build on Windows.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --locked

      # Generate icons/Icon.ico + installer/*.bmp from icons/Icon.png.
      # The committed artifacts are reused when present.
      - name: Generate installer assets
        run: cargo run --locked --manifest-path tools/gen-assets/Cargo.toml --release

      - name: Build installer (NSIS)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $nsis = "$env:NSIS_EXE"
          if (-not (Test-Path $nsis)) {
            Write-Host 'NSIS not found on runner - installing via choco'
            choco install nsis -y --no-progress
            $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          }
          # NSIS VIProductVersion needs numeric X.X.X — drop any -suffix.
          $ver = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            ($env:GITHUB_REF_NAME -replace '^v', '') -replace '-.*$', ''
          } else { '0.0.0' }
          & "$nsis" "/DVERSION=$ver" /V2 installer\patchkit.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path dist\patchkit-setup.exe)) { exit 1 }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: patchkit
          path: |
            target/release/patchkit.exe
            dist/patchkit-setup.exe

      # Pushing a `v*` tag publishes a versioned release.
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PatchKit ${{ github.ref_name }}
          body: |
            PatchKit ${{ github.ref_name }}.

            - `patchkit-setup.exe` — installer (Start Menu + desktop shortcuts, adds PatchKit to PATH)
            - `patchkit.exe` — standalone portable executable
          files: |
            target/release/patchkit.exe
            dist/patchkit-setup.exe

      # Keep one rolling "latest" release up to date on every push.
      - name: Publish rolling release
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Automated build of `${{ github.ref_name }}` at ${{ github.sha }}.

            - `patchkit-setup.exe` — installer (Start Menu + desktop shortcuts, adds PatchKit to PATH)
            - `patchkit.exe` — standalone portable executable
          files: |
            target/release/patchkit.exe
            dist/patchkit-setup.exe
